{% extends 'base.html' %}
{% load static %}

{% block styles %}

<style>
    .chat-page {

        height: 100%;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* ==========================
   MENSAJES
========================== */

    .chat-box {

        flex: 1;

        overflow-y: auto;

        padding: 30px 20px 120px;

        display: flex;
        flex-direction: column;

        min-height: 0;
    }

    .messages-container {

        width: 100%;

        max-width: 850px;

        margin: auto;

        display: flex;
        flex-direction: column;

        gap: 20px;
    }

    .message-row {

        display: flex;
    }

    .message-row.user {
        justify-content: flex-end;
    }

    .message-row.bot {
        justify-content: flex-start;
    }

    .message {

        max-width: 80%;

        padding: 14px 18px;

        border-radius: 20px;

        line-height: 1.6;

        font-size: 15px;

        white-space: pre-wrap;
    }

    .user .message {

        background: #120921;

        color: white;

        border-bottom-right-radius: 6px;
    }

    .bot .message {

        color: var(--text);

        border-bottom-left-radius: 6px;
    }

    /* ==========================
   PANTALLA VACÍA
========================== */

    .welcome {

        flex: 1;

        display: flex;
        flex-direction: column;

        justify-content: center;
        align-items: center;

        text-align: center;
    }

    .welcome h1 {

        font-size: 42px;

        margin-bottom: 12px;

        font-weight: 700;
    }

    .welcome p {

        color: var(--text-secondary);

        font-size: 16px;
    }



    /* ==========================
   INPUT
========================== */

    .chat-footer {

        padding: 20px;

        background: var(--bg);
    }

    .chat-input-wrapper {

        max-width: 850px;

        margin: auto;
    }

    .chat-input-container {

        display: flex;
        align-items: flex-end;

        gap: 10px;

        background: var(--card);

        border: 1px solid rgba(255, 255, 255, .08);

        border-radius: 28px;

        padding: 12px;
    }

    .chat-input {

        flex: 1;

        border: none;

        outline: none;

        resize: none;

        background: transparent;

        color: var(--text);

        font-size: 15px;

        max-height: 180px;

        min-height: 24px;
    }

    .send-btn {

        width: 42px;
        height: 42px;

        border: none;

        border-radius: 50%;

        background: #120921;

        color: white;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .send-btn:hover {

        background: #160b29;
    }

    /* ==========================
   LOADING
========================== */

    .typing {

        display: flex;
        gap: 5px;

        padding: 15px;
    }

    .typing span {

        width: 8px;
        height: 8px;

        border-radius: 50%;

        background: #999;

        animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
        animation-delay: .2s;
    }

    .typing span:nth-child(3) {
        animation-delay: .4s;
    }

    @keyframes bounce {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-6px);
        }
    }
</style>



<!--Estilos para las sugerencias de tablas-->
<style>
    .chat-input-wrapper {
        position: relative;
    }

    .tabla-suggestions {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        width: 100%;
        max-height: 250px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 6px;
        border: 1px solid var(--border-color, #d1d5db);
        border-radius: 12px;
        background: #0d0f1c;
        box-shadow: 0 8px 24px rgb(0 0 0 / 14%);
        z-index: 1000;
    }

    .tabla-suggestions.hidden {
        display: none;
    }

    .tabla-suggestion {
        display: block;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: white;
        text-align: left;
        overflow-wrap: anywhere;
        cursor: pointer;
    }

    .tabla-suggestion:hover,
    .tabla-suggestion.selected {
        background: var(--hover-bg, #211a41);
    }
</style>

<!--Titulo animado-->
<style>
    /* ==========================
   TÍTULO ANIMADO ANALYTIX
========================== */

    .welcome h1 {
        position: relative;
        margin-bottom: 12px;

        font-size: clamp(42px, 5vw, 58px);
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1.15;

        /* Degradado tecnológico */
        background: linear-gradient(110deg,
                #38bdf8 0%,
                #6366f1 35%,
                #a78bfa 60%,
                #38bdf8 100%);

        background-size: 250% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        /* Animaciones */
        animation:
            analytixEntrada 0.9s ease-out both,
            analytixBrillo 6s ease-in-out 0.9s infinite;

        /* Sombra sutil */
        filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.18));
    }

    /* Entrada suave desde abajo */
    @keyframes analytixEntrada {
        from {
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            filter: blur(6px);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }
    }

    /* Movimiento lento del degradado */
    @keyframes analytixBrillo {

        0%,
        100% {
            background-position: 0% center;
        }

        50% {
            background-position: 100% center;
        }
    }

    /* Compatibilidad con usuarios que reducen animaciones */
    @media (prefers-reduced-motion: reduce) {
        .welcome h1 {
            animation: none;
            background-position: center;
            filter: none;
        }
    }
</style>

<style>
    .welcome-subtitle {
        margin-top: 4px;
        color: var(--text-secondary);
        font-size: 15px;
        letter-spacing: 0.3px;
        opacity: 0;
        animation: subtituloEntrada 0.7s ease-out 0.4s forwards;
    }

    @keyframes subtituloEntrada {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<style>
    .welcome-icon {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
    }

    .welcome-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
        filter: drop-shadow(0 0 18px rgba(70, 130, 255, 0.25));
    }
</style>

{% endblock %}

{% block content %}


<!--Chat Agent-->
<div class="chat-page">


    <div class="chat-box" id="chatBox">

        <div class="welcome" id="welcome">
            <div class="welcome-icon">
                <img src="{% static 'images/analytix-icon-logo.png' %}" alt="Logo de AnalytiX" class="welcome-logo">
            </div>
            <h1>AnalytiX</h1>

            <p class="welcome-subtitle">
                Transformando datos en conocimiento y progreso para la humanidad.
            </p>
            <p class="welcome-subtitle">
            <div style="font-family: serif;">
                Model by: <img src="{% static 'images/claude-icon-logo.png' %}" alt="" width="20px" height="20px">
                Claude Haiku 5.5
            </div>

            </p>



        </div>

        <div class="messages-container" id="messagesContainer">
        </div>

    </div>


    <div class="chat-footer">

        <div class="chat-input-wrapper">

            <!-- Sugerencias de tablas -->
            <div id="tablaSuggestions" class="tabla-suggestions hidden"></div>

            <div class="chat-input-container">

                <textarea id="chatInput" class="chat-input" rows="1"
                    placeholder="Pregunta algo... Usa @ para mencionar tablas"></textarea>

                <button id="btnEnviarPrompt" class="send-btn">
                    <span class="material-symbols-outlined">
                        arrow_upward
                    </span>
                </button>

            </div>

        </div>

    </div>


</div>

{% endblock %}

{% block scripts %}

<script>

    const chatBox =
        document.getElementById("chatBox");

    const messagesContainer =
        document.getElementById("messagesContainer");

    const welcome =
        document.getElementById("welcome");

    const input =
        document.getElementById("chatInput");

    const btn =
        document.getElementById("btnEnviarPrompt");

    let tablasDisponibles = []

    /* AUTO RESIZE */

    input.addEventListener("input", () => {

        input.style.height = "auto";

        input.style.height =
            input.scrollHeight + "px";

    });

    /* MENSAJES */

    function agregarMensaje(texto, tipo) {

        welcome.style.display = "none";

        const row =
            document.createElement("div");

        row.className =
            `message-row ${tipo}`;

        const bubble =
            document.createElement("div");

        bubble.className =
            "message";

        bubble.innerText =
            texto;

        row.appendChild(bubble);

        messagesContainer.appendChild(row);

        chatBox.scrollTop =
            chatBox.scrollHeight;
    }

    async function enviarMensaje() {

        const texto = input.value.trim();

        if (!texto) return;
        const tablasUsadas = obtenerTablasUsadas(texto);
        agregarMensaje(texto, "user");

        input.value = "";
        input.style.height = "24px";

        // Mensaje temporal
        const loadingRow = document.createElement("div");
        loadingRow.className = "message-row bot";
        loadingRow.id = "loadingMessage";

        const loadingBubble = document.createElement("div");
        loadingBubble.className = "message typing";

        loadingBubble.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
    `;

        loadingRow.appendChild(loadingBubble);
        messagesContainer.appendChild(loadingRow);

        chatBox.scrollTop = chatBox.scrollHeight;

        try {

            const response = await fetch(
                "{% url 'ai_query' %}",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },

                    body: JSON.stringify({
                        pregunta: texto,
                        schema: tablasDisponibles,
                        tablasUsadas: tablasUsadas
                    })
                }
            );

            const data = await response.json();

            // eliminar loading
            loadingRow.remove();

            if (!response.ok) {

                agregarMensaje(
                    data.error || "Ocurrió un error.",
                    "bot"
                );

                return;
            }

            agregarMensaje(
                data.respuesta,
                "bot"
            );

        } catch (error) {

            loadingRow.remove();

            console.error(error);

            agregarMensaje(
                "No fue posible conectar con Analytix.",
                "bot"
            );
        }
    }

    /* EVENTOS */

    btn.addEventListener(
        "click",
        enviarMensaje
    );







    // Llama esta función cuando recibas la respuesta de activación.
    function actualizarTablasDisponibles(schema) {
        tablasDisponibles = Array.isArray(schema) ? schema : [];
    }

    const chatInput = document.getElementById("chatInput");
    const tablaSuggestions = document.getElementById("tablaSuggestions");

    let tablasFiltradas = [];
    let indiceTablaSeleccionada = 0;
    let rangoMencion = null;

    function ocultarTablas() {
        tablaSuggestions.classList.add("hidden");
        tablaSuggestions.replaceChildren();
        tablasFiltradas = [];
        rangoMencion = null;
    }

    function detectarMencionTabla() {
        const texto = chatInput.value;
        const cursor = chatInput.selectionStart;
        const textoAntes = texto.slice(0, cursor);

        // Detecta @ y el nombre parcial de la tabla.
        const coincidencia = textoAntes.match(/@([a-zA-Z0-9_]*)$/);

        if (!coincidencia || tablasDisponibles.length === 0) {
            ocultarTablas();
            return;
        }

        const termino = coincidencia[1].toLowerCase();

        tablasFiltradas = tablasDisponibles
            .filter(nombre => nombre.toLowerCase().includes(termino))
        /*.slice(0, 10);*/

        if (tablasFiltradas.length === 0) {
            ocultarTablas();
            return;
        }

        rangoMencion = {
            inicio: cursor - coincidencia[0].length,
            fin: cursor
        };

        indiceTablaSeleccionada = 0;
        tablaSuggestions.replaceChildren();

        tablasFiltradas.forEach((nombre, indice) => {
            const opcion = document.createElement("button");

            opcion.type = "button";
            opcion.className = "tabla-suggestion";
            opcion.textContent = nombre;
            opcion.setAttribute("role", "option");

            if (indice === 0) {
                opcion.classList.add("selected");
            }

            // mousedown evita perder el foco del textarea antes de insertar.
            opcion.addEventListener("mousedown", evento => {
                evento.preventDefault();
                insertarTabla(nombre);
            });

            tablaSuggestions.appendChild(opcion);
        });

        tablaSuggestions.classList.remove("hidden");
    }

    function insertarTabla(nombre) {
        if (!rangoMencion) return;

        const texto = chatInput.value;
        const { inicio, fin } = rangoMencion;

        const mencion = "@" + nombre;

        chatInput.value =
            texto.slice(0, inicio) +
            mencion +
            texto.slice(fin);

        const posicion = inicio + mencion.length;

        chatInput.focus();
        chatInput.setSelectionRange(posicion, posicion);

        ocultarTablas();
    }

    function actualizarSeleccionTabla() {
        const opciones = tablaSuggestions.querySelectorAll(
            ".tabla-suggestion"
        );

        opciones.forEach((opcion, indice) => {
            opcion.classList.toggle(
                "selected",
                indice === indiceTablaSeleccionada
            );
        });
    }

    chatInput.addEventListener("input", detectarMencionTabla);
    chatInput.addEventListener("click", detectarMencionTabla);

    chatInput.addEventListener("keydown", evento => {
        if (tablaSuggestions.classList.contains("hidden")) return;

        if (evento.key === "ArrowDown") {
            evento.preventDefault();

            indiceTablaSeleccionada =
                (indiceTablaSeleccionada + 1) % tablasFiltradas.length;

            actualizarSeleccionTabla();

        } else if (evento.key === "ArrowUp") {
            evento.preventDefault();

            indiceTablaSeleccionada =
                (indiceTablaSeleccionada - 1 + tablasFiltradas.length) %
                tablasFiltradas.length;

            actualizarSeleccionTabla();

        } else if (evento.key === "Enter" && !evento.shiftKey) {
            evento.preventDefault();

            if (tablasFiltradas.length > 0) {
                insertarTabla(tablasFiltradas[indiceTablaSeleccionada]);
            }

        } else if (evento.key === "Escape") {
            ocultarTablas();
        }
    });



    function obtenerTablasUsadas(pregunta) {
        const menciones = pregunta.match(/@([a-zA-Z0-9_]+)/g) || [];

        // Quitar @ y eliminar nombres duplicados.
        const tablasMencionadas = [...new Set(
            menciones.map(nombre => nombre.substring(1))
        )];

        // Validar que las tablas existan entre las disponibles.
        return tablasMencionadas.filter(nombre =>
            tablasDisponibles.includes(nombre)
        );
    }


    



</script>

{% endblock %}
